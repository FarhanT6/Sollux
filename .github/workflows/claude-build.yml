# The Sollux build agent, as a GitHub Action.
#
# Label an issue `claude-build` (the "Build request" template does this) and
# Claude Code builds it on a branch, type-checks both sides, opens a PR and
# comments the link on the issue. Mentioning @claude in an issue or PR
# comment does the same for that thread.
#
# One-time setup, in the repo's Settings → Secrets and variables → Actions:
#   ANTHROPIC_API_KEY  — an API key from console.anthropic.com
#   (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` on a Max plan, and
#    swap the input below)
name: Claude build agent

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    if: >
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'claude-build') || startsWith(github.event.issue.title, 'Build:')))
      || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (both sides)
        run: |
          (cd backend && npm ci --no-audit --no-fund)
          (cd frontend && npm ci --no-audit --no-fund)

      - name: Build it
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # On a Max plan, use this instead and drop anthropic_api_key:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash,Read,Edit,Write,Glob,Grep --max-turns 120"
          prompt: |
            You are the Sollux build agent. Read CLAUDE.md first — especially the "Agent workflow" section — and follow it exactly.

            The trigger is the GitHub issue or comment this workflow ran for (see the event context you were given). Build what it asks:

            1. Read the issue in full, including screenshots and attachments. If it is unclear, contradicts how the app works, or needs a decision only the owner can make (which of two readings, deleting data, changing money rules), post ONE comment on the issue with the specific question(s) and stop — do not build a guess.

            2. Otherwise:
               - Create a branch from the current checkout: `git checkout -b claude/build-<issue number>-<short-slug>`.
               - Make the change. Keep to what the issue asks. Match the conventions in CLAUDE.md and the surrounding code.
               - Schema changes need both a `backend/prisma/schema.prisma` edit and a hand-written migration under `backend/prisma/migrations/<YYYYMMDDHHMMSS>_<name>/migration.sql` with `IF NOT EXISTS` guards.
               - For bill-extraction work, verify against real statement PDFs when the issue attaches any (download them; run a scratch `npx tsx` script from `backend/`). Never guess at a bill's layout.
               - Type-check both sides and fix everything until clean: `cd backend && npx prisma generate && npx tsc --noEmit -p .` and `cd frontend && npx tsc --noEmit -p .`
               - Commit with a message that says what was wrong and what changed. Push the branch.
               - Open a pull request against `main`. Title: the change in one line. Body: what was wrong, what changed, which files, and `Closes #<issue number>`. Do NOT merge it unless the issue explicitly says "merge it".
               - Comment on the issue with one or two sentences and the PR link.

            3. Never touch secrets, `.env` files, credentials or keys; never log or print decrypted values; never return `usernameEnc`/`passwordEnc`/`accountNumberEnc` from an API. Never push to `main` directly. Never delete or rewrite user data in a migration.
